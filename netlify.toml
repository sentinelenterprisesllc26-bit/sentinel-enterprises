[build]
  command = "vite build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Paid PDFs are bundled into the /api/download function only — never published.
[functions.download]
  included_files = ["netlify/private-assets/**"]

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Path aliases / .org-era URLs → canonical .com pages (permanent)
[[redirects]]
  from = "/resources/wallet-security-checklist"
  to = "/crypto-inheritance-checklist"
  status = 301
  force = true

[[redirects]]
  from = "/resources/wallet-security-checklist/"
  to = "/crypto-inheritance-checklist"
  status = 301
  force = true

[[redirects]]
  from = "/crypto-security-checklist"
  to = "/crypto-inheritance-checklist"
  status = 301
  force = true

[[redirects]]
  from = "/crypto-security-checklist/"
  to = "/crypto-inheritance-checklist"
  status = 301
  force = true

[[redirects]]
  from = "/caregiver-checklist"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/caregiver-checklist/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wallet-security-checklist"
  to = "/crypto-inheritance-checklist"
  status = 301
  force = true

[[redirects]]
